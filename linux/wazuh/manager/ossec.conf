<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
  <use_password>no</use_password>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>yes</ssl_auto_negotiate>
  </auth>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

  <syscheck>
    <disabled>no</disabled>
    <frequency>1800</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" report_changes="yes">/etc/passwd,/etc/group,/etc/shadow,/etc/sudoers,/etc/sudoers.d,/etc/ssh/sshd_config,/etc/ssh/sshd_config.d</directories>
    <directories check_all="yes" report_changes="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/crontab,/var/spool/cron/crontabs</directories>
    <directories check_all="yes" report_changes="yes">/etc/ufw,/etc/iptables,/etc/nftables.conf,/etc/hosts,/root/.ssh,/home/*/.ssh</directories>
    <directories check_all="yes" report_changes="yes">/etc/systemd/system,/usr/lib/systemd/system,/etc/init.d,/etc/rc.local,/etc/profile.d</directories>
    <directories check_all="yes" report_changes="yes">/etc/kubernetes,/var/lib/kubelet,/etc/cni/net.d,/var/lib/etcd,/etc/containerd</directories>
    <directories check_all="yes" report_changes="yes">/etc/audit,/etc/audit/rules.d,/var/ossec/etc,/var/ossec/etc/rules,/var/ossec/etc/decoders,/var/ossec/etc/shared,/var/ossec/bin,/etc/filebeat</directories>

    <ignore>/var/ossec/logs/alerts</ignore>
    <ignore>/var/ossec/logs/archives</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
    <ignore>/dev</ignore>
    <ignore>/tmp</ignore>
    <ignore>/var/tmp</ignore>
    <ignore>/var/log</ignore>
  </syscheck>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
  </ruleset>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>
</ossec_config>
