<agent_config os="Linux" name="debian-security-lite">
  <!-- Targeted log sources only (no remote command collection). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mysql/error.log</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Critical-only FIM scope to reduce SIEM storage and RAM pressure. -->
  <syscheck>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" report_changes="yes">/etc/passwd,/etc/group,/etc/shadow,/etc/sudoers,/etc/sudoers.d,/etc/ssh/sshd_config,/etc/ssh/sshd_config.d</directories>
    <directories check_all="yes" report_changes="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/crontab,/var/spool/cron/crontabs</directories>
    <directories check_all="yes" report_changes="yes">/etc/nginx,/etc/apache2,/etc/mysql,/etc/mysql/mysql.conf.d,/etc/bind,/etc/resolv.conf</directories>
    <directories check_all="yes" report_changes="yes">/etc/ufw,/etc/iptables,/etc/nftables.conf,/root/.ssh,/home/*/.ssh</directories>
    <directories check_all="yes" report_changes="yes">/etc/systemd/system,/usr/lib/systemd/system,/etc/init.d,/etc/rc.local,/etc/profile.d</directories>
    <directories check_all="yes" report_changes="yes">/etc/kubernetes,/var/lib/kubelet,/etc/cni/net.d,/var/lib/etcd,/etc/containerd</directories>
    <directories check_all="yes" report_changes="yes">/etc/hosts,/etc/audit,/etc/audit/rules.d,/var/www/html/index.html,/var/www/html/.htaccess,/srv/http/index.html,/var/www/localhost/htdocs/index.html</directories>
    <directories check_all="yes" report_changes="yes">/var/www/html,/srv/http,/var/www/localhost/htdocs</directories>

    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
    <ignore>/dev</ignore>
    <ignore>/tmp</ignore>
    <ignore>/var/tmp</ignore>
    <ignore>/var/log</ignore>
  </syscheck>
</agent_config>
