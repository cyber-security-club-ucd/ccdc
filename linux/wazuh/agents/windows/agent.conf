<agent_config os="Windows" name="windows-security-lite">
  <!-- Focused Security channel collection for low-volume, high-value detections. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4625 or EventID=4720 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4728 or EventID=4732 or EventID=4756 or EventID=4946 or EventID=4947 or EventID=4948 or EventID=4950]</query>
  </localfile>

  <!-- Low-volume service change events for Wazuh service tamper detection. -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[Provider[@Name='Service Control Manager'] and (EventID=7036 or EventID=7040 or EventID=7045)]</query>
  </localfile>

  <!-- Netcat-specific process creation detections (4688) to avoid full process telemetry volume. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[EventID=4688] and EventData[Data[@Name='NewProcessName'] and (contains(.,'\\nc.exe') or contains(.,'\\ncat.exe'))]]</query>
  </localfile>

  <!-- Optional OpenSSH operational logs if server/client feature is installed. -->
  <localfile>
    <location>Microsoft-Windows-OpenSSH/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Critical-only FIM scope to reduce SIEM storage and RAM pressure. -->
  <syscheck>
    <frequency>3600</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" report_changes="yes">C:\ProgramData\ssh,C:\Users\*\.ssh,C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" report_changes="yes">C:\Windows\System32\inetsrv\config,C:\Windows\System32\LogFiles\Firewall</directories>
    <directories check_all="yes" report_changes="yes">C:\inetpub\wwwroot\iisstart.htm,C:\inetpub\wwwroot\web.config</directories>
    <directories check_all="yes" report_changes="yes">C:\inetpub\wwwroot</directories>

    <ignore>C:\Windows\Temp</ignore>
    <ignore>C:\Windows\SoftwareDistribution</ignore>
    <ignore>C:\Windows\WinSxS</ignore>
    <ignore>C:\Users\*\AppData\Local\Temp</ignore>
  </syscheck>
</agent_config>
